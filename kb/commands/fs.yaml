# fs.yaml — capability spec for filesystem_permissions (Task 11), read-only.
#
# Placeholder names are Frame slot keys: path.
#
# check_* intents are `test ... && printf ...` and-chains: base_argv is the
# test, and_argv is the printf that runs only when the test passes. The `&&`
# is inserted by the renderer (never a slot/argv element). NOTE: `test` does
# NOT support `--`, so check_* deliberately omit it (matching the dataset's
# reference commands); the slot value is still quoted to one argv element.
#
# chmod (Task 15) IS built now that the P2.0 gate exists: make_executable /
# remove_executable / set_permission carry risk_ops [write], so they only emit
# inside the maze in prototype mode. dir_empty is still NOT built (needs a
# `$(...)` command substitution the flat-argv/round-trip model can't represent
# safely) — the NLU still abstains on "is X empty".

capability: inspect_filesystem
utility: coreutils

intents:
  check_writable:
    base_argv: ["test", "-w", "{path}"]
    and_argv: ["printf", "writable\n"]
    risk_ops: ["read"]
  check_readable:
    base_argv: ["test", "-r", "{path}"]
    and_argv: ["printf", "readable\n"]
    risk_ops: ["read"]
  check_exists:
    base_argv: ["test", "-e", "{path}"]
    and_argv: ["printf", "found\n"]
    risk_ops: ["read"]
  show_permissions:
    base_argv: ["ls", "-ld", "--", "{path}"]
    risk_ops: ["read"]
  show_owner:
    base_argv: ["stat", "-c", "%U:%G", "--", "{path}"]
    risk_ops: ["read"]
  disk_usage:
    base_argv: ["du", "-sh", "--", "{path}"]
    risk_ops: ["read"]

  # --- chmod (Task 15): destructive, gated to the maze ---
  make_executable:
    base_argv: ["chmod", "u+x", "--", "{path}"]
    risk_ops: ["write"]
  remove_executable:
    base_argv: ["chmod", "a-x", "--", "{path}"]
    risk_ops: ["write"]
  set_permission:
    base_argv: ["chmod", "{mode}", "--", "{path}"]
    risk_ops: ["write"]
