# LinuxBuddy V1 — capability taxonomy
# Rebuilt from the 360 validated WSL scenarios (not NL2Bash).
# Tag `taxonomy-v1` once reviewed. Phase 2 writes the human test set against
# this; changing an intent after that invalidates part of the test set.
#
# User: a skilled professional (data scientist / ML engineer) handed Linux as
# a tool, on Ubuntu under WSL2. Expert in their field, new to Linux, no time
# to learn it as a subject.

version: 2
dataset_evidence: wsl-360-scenarios@8f653420
generated: 2026-11-03

slots:
  - id: PATH         # a file or directory, literal or named ("the data folder", "here")
  - id: EXT          # a file extension
  - id: SIZE         # a size threshold, normalizes to bytes
  - id: TIME         # an age / modification window, normalizes to -mtime/-mmin
  - id: PATTERN      # a string or glob to match in names or contents
  - id: COUNT        # a number of items or lines
  - id: PROCESS      # a process name, pattern, or PID
  - id: PORT         # a TCP/UDP port number
  - id: PERMISSION   # an octal or symbolic permission
  - id: WINPATH      # a Windows-side path (/mnt/c, C:\...) — WSL-specific

# Comparators, sort order, recursion and file-vs-directory type are derived
# deterministically as frame attributes, not slot types.

# Nine domains, each a cluster of intents. V1 ships the thin slice first
# (file_discovery), then widens domain by domain.

domains:

  - id: file_discovery          # 40 rows, 38 find — THE THIN SLICE for V1.0
    priority: 1
    thin_slice: true
    intents:
      - find_by_size            # "where are my big csv files"
      - find_by_time            # "what changed in the last day"
      - find_by_name            # "find files called config"
      - find_by_type            # "find all the python files"
    lead_utilities: [find, du]

  - id: file_inspection         # 40 rows
    priority: 2
    capability: inspect_file     # kb/commands/inspect.yaml (Task 08)
    # Built Task 08 (Tier 1, single-command only). detect_type was named
    # detect_filetype in the draft; show_size (wc -c) added.
    intents: [preview_head, preview_tail, count_lines, show_size, detect_type, show_stat]
    lead_utilities: [head, tail, stat, file, wc, cat]

  - id: text_and_logs           # 40 rows, 25 grep
    priority: 2
    capability: search_text      # kb/commands/text.yaml (Task 09)
    # Built Task 09 (Tier 1). grep flags carried as one combined token slot.
    intents: [search_in_file, search_recursive, count_matches, sort_lines, unique_lines]
    lead_utilities: [grep, sort, uniq, cut, tail]

  - id: workspace_and_shell     # 40 rows
    priority: 3
    capability: workspace  # kb/commands/workspace.yaml (Task 16)
    # Built Task 16 (Tier 3). Navigation/shell reads anywhere; make_dir +
    # setup_project (the ONE scoped multi-step recipe: mkdir dirs && cd) gated.
    # Arbitrary "do A then B" compound deferred to V1.1 (abstain).
    intents: [where_am_i, go_home, go_back, goto, list_all, who_am_i, which_shell, show_history, clear_screen, check_installed, make_dir, setup_project]
    lead_utilities: [cd, mkdir, pwd, git, history, command]
    note: scoped multi-step only (setup_project = mkdir dirs && cd); general compound is V1.1

  - id: filesystem_permissions  # 40 rows
    priority: 3
    capability: inspect_filesystem  # kb/commands/fs.yaml (Task 11)
    # Reads Task 11; chmod writes added Task 15 (gated, P2.0). COMPLETE except
    # dir_empty (deferred — needs $(...) command substitution).
    intents: [check_writable, check_readable, check_exists, show_permissions, show_owner, disk_usage, make_executable, remove_executable, set_permission]
    lead_utilities: [stat, chmod, test, find, du]

  - id: processes               # 40 rows
    priority: 3
    capability: inspect_process  # kb/commands/process.yaml (Task 10)
    # Reads Task 10; kill writes added Task 15 (gated, P2.0). COMPLETE.
    # top_by_cpu/mem use a 2-stage pipe (ps | head).
    intents: [list_processes, top_by_cpu, top_by_mem, find_process, process_on_port, show_pid, kill_process, kill_pid]
    lead_utilities: [ps, pgrep, ss, kill]
    note: WSL has no systemd — use ps/pgrep/pkill, never systemctl

  - id: wsl_interop             # 40 rows — the differentiator, no prior corpus
    priority: 2
    capability: wsl_interop  # kb/commands/wsl.yaml (Task 17)
    # Built Task 17 (Tier 3), all read-only. Nested $(...) navigation (windows
    # downloads/desktop/user folder, cp to windows) deferred to V1.1 (abstain).
    # explorer/clip are hand-tested (GUI/clipboard); wslpath/df script-verified.
    intents: [open_explorer, goto_cdrive, goto_home, path_to_linux, path_to_windows, copy_to_clipboard, cdrive_space, home_space]
    lead_utilities: [explorer.exe, wslpath, clip.exe, cd, df]

  - id: archives_backup         # 40 rows, 15 tar
    priority: 4
    capability: manage_archives  # kb/commands/archive.yaml (Task 13)
    # Built Task 13 (Tier 2). Reads work anywhere; writes gated to maze (P2.0).
    # Deferred: zip create/extract (zipfile -c/-e), redirects (gzip -dc/-xOf),
    # cp folder copies, gzip -l, member-filtered/deterministic tar, checksum.
    intents: [list_archive, list_zip, archive_integrity, archive_size, create_archive, extract_archive, compress_file]
    lead_utilities: [tar, gzip, sha256sum, zip]

  - id: python_environments     # 40 rows, 31 python3
    priority: 4
    capability: python_env  # kb/commands/python.yaml (Task 14)
    # Built Task 14 (Tier 2). Reads work anywhere; writes gated to maze (P2.0).
    # Deferred (network/shell-state/long-running/compound): venv create,
    # pip install/upgrade/download/freeze, venv activate/deactivate, http.server,
    # compileall, module run, REPL, list_packages/package_version.
    intents: [python_version, where_python, check_package, run_script, check_syntax]
    lead_utilities: [python3, pip]

deferred:
  - { id: find_then_act, version: V1.5, reason: "find | xargs rm — needs preview + safety suite first" }
  - { id: git_workflows, version: V1.5, reason: "large domain of its own; only navigate/init in V1" }
  - { id: text_transform, version: V1.5, reason: "awk/sed are languages, not single commands; tier 2 covers them" }
  - { id: containers_k8s_ssh_db, version: V2, reason: "beyond the WSL-migrant first-month surface" }
